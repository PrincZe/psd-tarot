<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mystic Tarot — Print Codes</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Georgia, serif; background: white; }

    @media print {
      body { margin: 0; }
      .no-print { display: none !important; }
      .page { page-break-after: always; }
      .page:last-child { page-break-after: avoid; }
    }

    .no-print {
      padding: 20px;
      text-align: center;
      background: #1a1a2e;
      color: #d4af37;
    }
    .no-print button {
      background: #d4af37;
      color: #1a1a2e;
      border: none;
      padding: 12px 32px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }

    .page {
      width: 210mm;
      min-height: 297mm;
      margin: 0 auto;
      padding: 10mm;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 4mm;
    }

    .card {
      border: 2px solid #1a1a2e;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      position: relative;
      background: linear-gradient(135deg, #fefefe 0%, #f8f4e8 100%);
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 4px;
      border: 1px solid #d4af37;
      border-radius: 6px;
      pointer-events: none;
    }

    .card-icon {
      font-size: 28px;
      color: #1a1a2e;
      margin-bottom: 6px;
    }

    .card-title {
      font-size: 14px;
      font-weight: bold;
      color: #1a1a2e;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .card-subtitle {
      font-size: 9px;
      color: #666;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .card-code {
      font-family: 'Courier New', monospace;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 3px;
      color: #1a1a2e;
      background: #f0ead6;
      padding: 6px 16px;
      border-radius: 4px;
      border: 1px solid #d4af37;
    }

    .card-instruction {
      font-size: 8px;
      color: #888;
      margin-top: 8px;
      text-align: center;
      line-height: 1.4;
    }

    .card-corners {
      position: absolute;
      font-size: 10px;
      color: #d4af37;
    }
    .card-corners.tl { top: 8px; left: 10px; }
    .card-corners.tr { top: 8px; right: 10px; }
    .card-corners.bl { bottom: 8px; left: 10px; }
    .card-corners.br { bottom: 8px; right: 10px; }
  </style>
</head>
<body>
  <div class="no-print">
    <h1>Mystic Tarot — Printable Code Cards</h1>
    <p>15 cards per page (3x5 grid) — cut along the borders</p>
    <button onclick="window.print()">Print All Cards</button>
  </div>

      pageCodes.forEach(code => {
        pageDiv.innerHTML += `
          <div class="card">

</body>
</html>
